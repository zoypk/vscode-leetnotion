name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release identity
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          artifact="vscode-leetnotion-${package_version}.vsix"
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Validate source and data
        run: npm run verify

      - name: Package and revalidate exact release artifact
        run: npm run verify:package

      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-leetnotion-${{ github.ref_name }}
          path: ${{ steps.contract.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Leetnotion ${{ github.ref_name }}
          files: ${{ steps.contract.outputs.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
