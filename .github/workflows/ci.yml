name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source and data
        run: npm run verify

      - name: Package extension
        run: npm run package

      - name: Validate VSIX
        run: npm run verify:vsix

      - name: Validate release identity agreement
        run: npm test -- test/package/manifest.test.cjs

      - name: Upload validated VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-leetnotion-${{ github.sha }}
          path: vscode-leetnotion-*.vsix
          if-no-files-found: error
          retention-days: 14
